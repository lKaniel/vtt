    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b39468"/>
      <stop offset="0.55" stop-color="#6e5839"/>
      <stop offset="1" stop-color="#2e251a"/>
