name: probe
on:
  push:
    branches: [claude/project-thread-e92bl1]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://content.baileywiki.com/api/files/download?file_path=bw-content-releases%2FCompendium%2Fbaileywiki-content.maps.json" -o maps.json -w "%{http_code}\n"
          python3 - <<'PY'
          import json,urllib.parse
          m=json.load(open('maps.json')); print(list(m.keys())); idx=m['index']; print(len(idx))
          for e in idx[:4]: print(json.dumps(e)[:300])
          open('t.txt','w').write('\n'.join(e.get('thumb') or '' for e in idx[:3]))
          PY
          while read t; do echo "== $t"; curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "https://content.baileywiki.com/api/files/thumbnail?file_path=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1].lstrip('/'),safe=''))" "$t")"; done < t.txt
          curl -sS -w "\nfd %{http_code}\n" -X POST -H 'content-type: application/json' -d '{"file_path":"modules/baileywiki-maps-premium-towns/maps/active-tiles/active-tile-2x2.webp"}' https://content.baileywiki.com/api/files/file-details | head -c 300
