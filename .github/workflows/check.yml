name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # The end-to-end suite runs one test at a time on a machine (software WebGL
  # is slow, and parallel browsers starve each other), split over three.
  e2e-shard:
    name: e2e ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vtt/e2e exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e --shard=${{ matrix.shard }}
        env:
          E2E_NO_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ strategy.job-index }}
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7

  # One check named e2e that passes when every shard does.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
